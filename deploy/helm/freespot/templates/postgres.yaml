apiVersion: v1
kind: Service
metadata:
  name: freespot-postgres
  labels: {app.kubernetes.io/part-of: freespot}
spec:
  clusterIP: None
  selector: {app: freespot-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freespot-postgres
  labels: {app.kubernetes.io/part-of: freespot}
spec:
  serviceName: freespot-postgres
  replicas: 1
  selector:
    matchLabels: {app: freespot-postgres}
  template:
    metadata:
      labels: {app: freespot-postgres, app.kubernetes.io/part-of: freespot}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      tolerations: {{ .Values.tolerations | toJson }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: freespot}
            - {name: POSTGRES_DB, value: freespot}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: postgres-password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, freespot, -d, freespot]}
          livenessProbe:
            exec: {command: [pg_isready, -U, freespot, -d, freespot]}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
