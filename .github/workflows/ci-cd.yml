name: FreeSpot CI/CD
on:
  push:
    branches: [master, 'devops/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: freespot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - run: |
          helm lint deploy/helm/freespot --set backend.tag=check --set frontend.tag=check
          helm template freespot deploy/helm/freespot --namespace team-3 --set backend.tag=check --set frontend.tag=check > /dev/null
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VITE_BASE_PATH=/team-3/
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    # The API server is in a private network. Register this runner there.
    runs-on: [self-hosted, linux, team-3]
    timeout-minutes: 20
    concurrency:
      group: freespot-team-3-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.31.5
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG"
          umask 077
          CONFIG=$(mktemp)
          printf '%s' "$KUBE_CONFIG" > "$CONFIG"
          echo "KUBECONFIG=$CONFIG" >> "$GITHUB_ENV"
      - name: Deploy release
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: deploy/k8s/deploy.sh
      - name: Remove kubeconfig
        if: always()
        run: |
          if [ -n "${KUBECONFIG:-}" ]; then rm -f "$KUBECONFIG"; fi
