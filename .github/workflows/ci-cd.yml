name: FreeSpot CI
on:
  push:
    branches: [master, 'devops/**']
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read
concurrency:
  group: freespot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - run: |
          helm lint deploy/helm/freespot --set backend.tag=check --set frontend.tag=check
          helm template freespot deploy/helm/freespot --namespace team-3 --set backend.tag=check --set frontend.tag=check > /dev/null
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VITE_BASE_PATH=/team-3/
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
